schema_version: "1.0"

hooks:
  before_spec:
    - skill: project-context
      mode: required
      description: Load project-specific constraints and the current project baseline
  after_spec:
    - skill: spec-review
      mode: required
      description: Check scope, acceptance criteria, edge cases, and measurable outcomes
  before_design:
    - skill: technical-context
      mode: required
      description: Load implementation and security constraints relevant to the design
  after_design:
    - skill: adr-review
      mode: required
      description: Review architecture decisions, alternatives, performance, and revisit conditions
  after_plan:
    - skill: plan-review
      mode: required
      description: Verify requirement traceability, dependencies, and test gates
  before_implement:
    - skill: implementation-preflight
      mode: required
      description: Verify clean inputs, approved ADRs, and the target task state
  after_implement:
    - skill: verify
      mode: required
      description: Run implementation, domain-specific, and specification checks
  before_verify:
    - skill: verification-context
      mode: optional
      prompt: Confirm the target runtime or host, devices, performance budget, and manual checks
  after_verify:
    - skill: verification-review
      mode: required
      description: Reject unsupported pass claims and report remaining limitations
